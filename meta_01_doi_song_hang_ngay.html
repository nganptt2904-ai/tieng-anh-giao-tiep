  var enc = new TextEncoder(), dec = new TextDecoder();
  function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
  function toHex(buf){ return Array.prototype.map.call(new Uint8Array(buf), function(x){ return ('0' + x.toString(16)).slice(-2); }).join(''); }
  function get(k){ try{ return localStorage.getItem(k) || sessionStorage.getItem(k); }catch(e){ return null; } }
  function put(k, v, remember){ try{ (remember ? localStorage : sessionStorage).setItem(k, v); }catch(e){} }
  function forget(k){ try{ localStorage.removeItem(k); sessionStorage.removeItem(k); }catch(e){} }
  var $ = function(id){ return document.getElementById(id); };
  function show(html){ document.open(); document.write(html); document.close(); }
  async function openWith(rawK){
    var key = await crypto.subtle.importKey('raw', rawK, 'AES-GCM', false, ['decrypt']);
    var buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(C.iv), additionalData: enc.encode(C.name) }, key, b64(C.ct));
    return dec.decode(buf);
  }
  async function tryStored(){
    var k = get('eg_k'); if(!k) return false;
    var page;
    try{ page = await openWith(b64(k)); }catch(e){ forget('eg_k'); return false; }
    // Đợi trang cổng tải xong rồi mới thay nội dung (lỗi thật 2026-10-26: thay lúc trình duyệt còn đang phân tích → thẻ "Đang mở…" nằm cạnh trang học).
    if(document.readyState !== 'complete'){ await new Promise(function(r){ window.addEventListener('load', r, { once: true }); }); }
    show(page); return true;
  }
  async function login(user, pass, remember){
    var id = toHex(await crypto.subtle.digest('SHA-256', enc.encode('eg|' + user.trim().toLowerCase()))).slice(0, 16);
    var slot = null; for(var i = 0; i < C.slots.length; i++){ if(C.slots[i].id === id){ slot = C.slots[i]; break; } }
    if(!slot) throw new Error('bad');
    async function unwrap(pw){
      var base = await crypto.subtle.importKey('raw', enc.encode(pw.normalize('NFKC')), 'PBKDF2', false, ['deriveBits']);
      var wkBits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(slot.s), iterations: C.iter }, base, 256);
      var wk = await crypto.subtle.importKey('raw', wkBits, 'AES-GCM', false, ['decrypt']);
      return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(slot.iv) }, wk, b64(slot.w)));
    }
    var rawK;
    try{ rawK = await unwrap(pass); }
    catch(e){ if(pass !== pass.trim()) rawK = await unwrap(pass.trim()); else throw e; }  // dán mật khẩu từ tin nhắn hay kèm dấu cách/xuống dòng cuối
    var page = await openWith(rawK);
    var kb = btoa(String.fromCharCode.apply(null, rawK));
    put('eg_k', kb, remember);
    show(page);
  }
  function ready(){
    if(!(window.crypto && crypto.subtle)){ $('msg').textContent = 'Trình duyệt này không hỗ trợ mã hóa (cần HTTPS và trình duyệt mới). Hãy dùng Chrome hoặc Safari mới.'; $('go').disabled = true; return; }
    $('f').addEventListener('submit', async function(ev){
      ev.preventDefault();
      var btn = $('go'); btn.disabled = true; $('msg').textContent = 'Đang kiểm tra… (vài giây)';
      try{ await login($('u').value, $('p').value, $('r').checked); }
      catch(e){ $('msg').textContent = 'Tên đăng nhập hoặc mật khẩu không đúng, hoặc bạn chưa được duyệt.'; btn.disabled = false; }
    });
  }
  (async function(){
    if(!(window.crypto && crypto.subtle)){ $('wait').style.display = 'none'; $('box').style.display = 'block'; ready(); return; }
    var ok = await tryStored();
    if(!ok){ $('wait').style.display = 'none'; $('box').style.display = 'block'; ready(); }
  })();
})();
