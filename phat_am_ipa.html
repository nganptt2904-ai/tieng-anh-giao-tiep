<head>
<meta charset="UTF-8">

<title>Tiếng Anh giao tiếp — đăng nhập</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0c5a8f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tiếng Anh"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" href="icons/icon-192.png">
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--sub:#5b6470;--line:#e3e6ea;--accent:#0c5a8f}
  @media (prefers-color-scheme:dark){:root{--bg:#14181e;--card:#1d232b;--ink:#e8ecf1;--sub:#a3acb8;--line:#2d353f;--accent:#5aa9e0}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:380px;width:100%}
  h1{font-size:20px;margin:0 0 4px}
  p{margin:6px 0;color:var(--sub);font-size:14px}
  label{display:block;font-size:13px;margin:12px 0 4px;color:var(--sub)}
  input[type=text],input[type=password]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:var(--bg);color:var(--ink)}
  button{margin-top:14px;width:100%;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:16px;cursor:pointer}
  button:disabled{opacity:.5}
  .chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:var(--sub)}
  #msg{min-height:20px;margin-top:10px;font-size:14px;color:#b5442e}
  .small{font-size:12.5px;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <h1>Tiếng Anh giao tiếp</h1>
  <p id="wait">Đang mở…</p>
  <div id="box" style="display:none">
    <p>Trang học riêng. Đăng nhập bằng tài khoản đã được duyệt.</p>
    <form id="f" autocomplete="on">
      <label for="u">Tên đăng nhập</label>
      <input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" required>
      <label for="p">Mật khẩu</label>
      <input type="password" id="p" name="password" autocomplete="current-password" required>
      <label class="chk"><input type="checkbox" id="r" checked> Nhớ đăng nhập trên thiết bị này</label>
      <button id="go" type="submit">Vào học</button>
      <div id="msg" role="alert"></div>
    </form>
    <p class="small">Chưa có tài khoản? <a href="https://docs.google.com/forms/d/e/1FAIpQLScMdFcNnQmEDtbFiuiIngDwButkyQSvUr0oYok6mBtFnol-lQ/viewform" target="_blank" rel="noopener noreferrer">Gửi yêu cầu xin quyền truy cập</a> — Ngân sẽ xem và liên hệ lại.</p>
  </div>
</div>

  var enc = new TextEncoder(), dec = new TextDecoder();
  function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
  function toHex(buf){ return Array.prototype.map.call(new Uint8Array(buf), function(x){ return ('0' + x.toString(16)).slice(-2); }).join(''); }
  function get(k){ try{ return localStorage.getItem(k) || sessionStorage.getItem(k); }catch(e){ return null; } }
  function put(k, v, remember){ try{ (remember ? localStorage : sessionStorage).setItem(k, v); }catch(e){} }
  function forget(k){ try{ localStorage.removeItem(k); sessionStorage.removeItem(k); }catch(e){} }
  var $ = function(id){ return document.getElementById(id); };
  function show(html){ document.open(); document.write(html); document.close(); }
  async function openWith(rawK){
    var key = await crypto.subtle.importKey('raw', rawK, 'AES-GCM', false, ['decrypt']);
    var buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(C.iv), additionalData: enc.encode(C.name) }, key, b64(C.ct));
    return dec.decode(buf);
  }
  async function tryStored(){
    var k = get('eg_k'); if(!k) return false;
    var page;
    try{ page = await openWith(b64(k)); }catch(e){ forget('eg_k'); return false; }
    // Phải đợi trang cổng tải xong rồi mới document.open(): nếu gọi lúc trình duyệt còn đang phân tích trang, bản mở khóa bị chèn
    // CẠNH thẻ cổng (lỗi thật 2026-10-26: thẻ "Đang mở…" nằm cạnh trang học, vì body của cổng là flex).
    if(document.readyState !== 'complete'){ await new Promise(function(r){ window.addEventListener('load', r, { once: true }); }); }
    show(page); return true;
  }
  async function login(user, pass, remember){
    var id = toHex(await crypto.subtle.digest('SHA-256', enc.encode('eg|' + user.trim().toLowerCase()))).slice(0, 16);
    var slot = null; for(var i = 0; i < C.slots.length; i++){ if(C.slots[i].id === id){ slot = C.slots[i]; break; } }
    if(!slot) throw new Error('bad');
    async function unwrap(pw){
      var base = await crypto.subtle.importKey('raw', enc.encode(pw.normalize('NFKC')), 'PBKDF2', false, ['deriveBits']);
      var wkBits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(slot.s), iterations: C.iter }, base, 256);
      var wk = await crypto.subtle.importKey('raw', wkBits, 'AES-GCM', false, ['decrypt']);
      return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(slot.iv) }, wk, b64(slot.w)));
    }
    var rawK;
    try{ rawK = await unwrap(pass); }
    catch(e){ if(pass !== pass.trim()) rawK = await unwrap(pass.trim()); else throw e; }  // dán mật khẩu từ tin nhắn hay kèm dấu cách/xuống dòng cuối
    var page = await openWith(rawK);
    var kb = btoa(String.fromCharCode.apply(null, rawK));
    put('eg_k', kb, remember);
    show(page);
  }
  function ready(){
    if(!(window.crypto && crypto.subtle)){ $('msg').textContent = 'Trình duyệt này không hỗ trợ mã hóa (cần HTTPS và trình duyệt mới). Hãy dùng Chrome hoặc Safari mới.'; $('go').disabled = true; return; }
    $('f').addEventListener('submit', async function(ev){
      ev.preventDefault();
      var btn = $('go'); btn.disabled = true; $('msg').textContent = 'Đang kiểm tra… (vài giây)';
      try{ await login($('u').value, $('p').value, $('r').checked); }
      catch(e){ $('msg').textContent = 'Tên đăng nhập hoặc mật khẩu không đúng, hoặc bạn chưa được duyệt.'; btn.disabled = false; }
    });
  }
  (async function(){
    if(!(window.crypto && crypto.subtle)){ $('wait').style.display = 'none'; $('box').style.display = 'block'; ready(); return; }
    var ok = await tryStored();
    if(!ok){ $('wait').style.display = 'none'; $('box').style.display = 'block'; ready(); }
  })();
})();
</script>
